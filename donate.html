<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donate - Fair Future</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Shrikhand&display=swap" rel="stylesheet">

  <style>
    .font-logo {
      font-family: 'Shrikhand', cursive;
    }
  </style>
</head>
<body class="bg-[#F3EAE0]">

  <div class="p-4">

    <!-- NAV BAR -->
    <nav class="flex flex-col md:grid md:grid-cols-3 items-center gap-3 md:gap-0 bg-[#EDE0D2] border border-[#D9C9B6] rounded-2xl px-4 sm:px-6 py-3 sm:py-4">
      <a href="index.html" class="flex items-center gap-0.5 hover:opacity-70 transition md:justify-self-start"><img src="images/logo.png" alt="Fair Future logo" class="h-14 w-14 sm:h-24 sm:w-24 object-contain sm:-my-[34px]"><span class="font-logo text-xl sm:text-2xl text-[#3A0E14]">Fair Future</span></a>
      <div class="flex flex-wrap justify-center gap-4 sm:gap-6 text-sm text-[#4A3B30] md:justify-self-center">
        <a href="applicants.html">For applicants</a>
        <a href="volunteers.html">For volunteers</a>
        <a href="schools.html">For schools</a>
      </div>
      
    </nav>

    <!-- BACK BUTTON -->
    <button onclick="history.back()" class="flex items-center gap-1 text-sm text-[#6B1D28] mt-4 ml-1 hover:opacity-70 transition">
      &#8592; Back
    </button>

    <!-- PAGE HEADER -->
    <div class="text-center pt-8 pb-2 px-4 max-w-xl mx-auto">
      <h1 class="text-3xl font-medium text-[#2B1015] mb-3">Support Fair Future</h1>
      <p class="text-[#5C4A3D] text-sm leading-relaxed">Every donation goes directly toward opportunities and funding requests for students.</p>
    </div>

    <!-- DONATE FORM -->
    <div class="max-w-md mx-auto mt-6 mb-16 bg-[#F3EAE0] border border-[#D9C9B6] rounded-2xl p-6">

      <!-- ONE-TIME / MONTHLY TOGGLE -->
      <div class="flex bg-[#EDE0D2] border border-[#D9C9B6] rounded-lg p-1 mb-6">
        <button id="oneTimeBtn" class="flex-1 py-2 rounded-md text-sm font-medium bg-[#6B1D28] text-[#F3EAE0] transition">One-time</button>
        <button id="monthlyBtn" class="flex-1 py-2 rounded-md text-sm font-medium text-[#4A3B30] transition">Monthly</button>
      </div>

      <!-- PRESET AMOUNTS -->
      <div class="grid grid-cols-4 gap-2 mb-4" id="presetAmounts">
        <button data-amount="5" class="amount-btn border border-[#B79E86] text-[#6B1D28] py-3 rounded-md text-sm font-medium">£5</button>
        <button data-amount="10" class="amount-btn border border-[#B79E86] text-[#6B1D28] py-3 rounded-md text-sm font-medium">£10</button>
        <button data-amount="25" class="amount-btn border border-[#B79E86] text-[#6B1D28] py-3 rounded-md text-sm font-medium">£25</button>
        <button data-amount="50" class="amount-btn border border-[#B79E86] text-[#6B1D28] py-3 rounded-md text-sm font-medium">£50</button>
      </div>

      <!-- CUSTOM AMOUNT -->
      <label class="text-sm text-[#4A3B30] block mb-1">Or enter a custom amount</label>
      <div class="relative mb-6">
        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-sm text-[#5C4A3D]">£</span>
        <input type="number" id="customAmount" min="1" step="0.01" placeholder="0.00"
          class="w-full bg-[#F3EAE0] border border-[#B79E86] rounded-md pl-7 pr-3 py-2 text-sm">
      </div>

      <button id="donateBtn" class="w-full bg-[#6B1D28] text-[#F3EAE0] py-3 rounded-md text-sm font-medium">
        Donate
      </button>

      <p class="text-xs text-[#8A6A55] text-center mt-3">You'll be securely redirected to Stripe to complete your payment.</p>

    </div>

  </div>

  <script>
    let selectedAmount = null;
    let isRecurring = false;

    const presetButtons = document.querySelectorAll('.amount-btn');
    const customAmountInput = document.getElementById('customAmount');
    const oneTimeBtn = document.getElementById('oneTimeBtn');
    const monthlyBtn = document.getElementById('monthlyBtn');

    // Clicking a preset amount selects it and highlights the button
    presetButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        selectedAmount = btn.dataset.amount;
        customAmountInput.value = ''; // clear custom field if a preset is picked

        presetButtons.forEach(b => {
          b.className = 'amount-btn border border-[#B79E86] text-[#6B1D28] py-3 rounded-md text-sm font-medium';
        });
        btn.className = 'amount-btn border border-[#6B1D28] bg-[#6B1D28] text-[#F3EAE0] py-3 rounded-md text-sm font-medium';
      });
    });

    // Typing a custom amount deselects any preset button
    customAmountInput.addEventListener('input', () => {
      selectedAmount = null;
      presetButtons.forEach(b => {
        b.className = 'amount-btn border border-[#B79E86] text-[#6B1D28] py-3 rounded-md text-sm font-medium';
      });
    });

    // Toggle between one-time and monthly
    oneTimeBtn.addEventListener('click', () => {
      isRecurring = false;
      oneTimeBtn.className = 'flex-1 py-2 rounded-md text-sm font-medium bg-[#6B1D28] text-[#F3EAE0] transition';
      monthlyBtn.className = 'flex-1 py-2 rounded-md text-sm font-medium text-[#4A3B30] transition';
    });

    monthlyBtn.addEventListener('click', () => {
      isRecurring = true;
      monthlyBtn.className = 'flex-1 py-2 rounded-md text-sm font-medium bg-[#6B1D28] text-[#F3EAE0] transition';
      oneTimeBtn.className = 'flex-1 py-2 rounded-md text-sm font-medium text-[#4A3B30] transition';
    });

    document.getElementById('donateBtn').addEventListener('click', async () => {
      const amount = selectedAmount || customAmountInput.value;

      if (!amount || Number(amount) <= 0) {
        alert('Please choose or enter a donation amount.');
        return;
      }

      try {
        const response = await fetch('https://sparkling-reflection-production-4146.up.railway.app/create-checkout-session', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            amount: amount,
            recurring: isRecurring,
            // window.location.origin means this works whether you're testing
            // locally or once the site is live on a real domain.
            successUrl: `${window.location.origin}/thank-you.html`,
            cancelUrl: `${window.location.origin}/donate.html`
          })
        });

        const data = await response.json();

        if (response.ok) {
          // Send the browser to Stripe's secure checkout page.
          window.location.href = data.url;
        } else {
          alert(data.error || 'Something went wrong. Please try again.');
        }
      } catch (err) {
        console.error(err);
        alert('Could not reach the server. Make sure the backend is running.');
      }
    });
  </script>

  <div id="siteFooter"></div>
  <script src="site-footer.js"></script>
</body>
</html>
