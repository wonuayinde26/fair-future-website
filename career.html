<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Career - Fair Future</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Shrikhand&display=swap" rel="stylesheet">

  <style>
    .font-logo {
      font-family: 'Shrikhand', cursive;
    }
    .rank-item.dragging {
      opacity: 0.4;
    }
  </style>
</head>
<body class="bg-[#F3EAE0]">

  <div class="p-4">

    <!-- NAV BAR -->
    <nav class="flex flex-col md:grid md:grid-cols-3 items-center gap-3 md:gap-0 bg-[#EDE0D2] border border-[#D9C9B6] rounded-2xl px-4 sm:px-6 py-3 sm:py-4">
      <a href="index.html" class="flex items-center gap-0.5 hover:opacity-70 transition md:justify-self-start"><img src="images/logo.png" alt="Fair Future logo" class="h-14 w-14 sm:h-24 sm:w-24 object-contain sm:-my-[34px]"><span class="font-logo text-xl sm:text-2xl text-[#3A0E14]">Fair Future</span></a>
      <div class="flex flex-wrap justify-center gap-4 sm:gap-6 text-sm text-[#4A3B30] md:justify-self-center">
        <a href="applicants.html" class="text-[#6B1D28] font-medium">For applicants</a>
        <a href="volunteers.html">For volunteers</a>
        <a href="schools.html">For schools</a>
      </div>
      
    </nav>

    <!-- BACK BUTTON: returns to whatever page the user came from -->
    <button onclick="history.back()" class="flex items-center gap-1 text-sm text-[#6B1D28] mt-4 ml-1 hover:opacity-70 transition">
      &#8592; Back
    </button>

    <!-- FORM -->
    <div class="max-w-md mx-auto mt-10 mb-16 bg-[#F3EAE0] border border-[#D9C9B6] rounded-2xl p-6">

      <p class="text-xs uppercase tracking-wide text-[#8A6A55] mb-1">Career</p>
      <h1 class="text-lg font-medium text-[#2B1015] mb-1">Tell us about you</h1>
      <p class="text-sm text-[#5C4A3D] mb-5">We'll use this to connect you to the right opportunities.</p>

      <form id="careerForm">

        <label class="text-sm text-[#4A3B30] block mb-1">Full name</label>
        <input type="text" name="fullName" required placeholder="Jane Doe"
          class="w-full bg-[#F3EAE0] border border-[#B79E86] rounded-md px-3 py-2 text-sm mb-4">

        <label class="text-sm text-[#4A3B30] block mb-1">Email</label>
        <input type="email" name="email" required placeholder="name@email.com"
          class="w-full bg-[#F3EAE0] border border-[#B79E86] rounded-md px-3 py-2 text-sm mb-4">

        <label class="text-sm text-[#4A3B30] block mb-1">What do you want to be when you're older?</label>
        <input type="text" name="aspiration" placeholder="e.g. software engineer, journalist"
          class="w-full bg-[#F3EAE0] border border-[#B79E86] rounded-md px-3 py-2 text-sm mb-5">

        <label class="text-sm text-[#4A3B30] block mb-1">Rank what you'd like help with</label>
        <p class="text-xs text-[#8A6A55] mb-3">Drag to reorder, 1st is your top choice.</p>

        <div id="rankList" class="flex flex-col gap-2 mb-5">
          <div class="rank-item flex items-center gap-3 bg-[#EDE0D2] border border-[#D9C9B6] rounded-lg px-4 py-3 cursor-grab" style="touch-action: none;" draggable="true" data-value="Tech">
            <span class="rank-num w-6 h-6 rounded-full bg-[#6B1D28] text-[#F3EAE0] text-xs flex items-center justify-center shrink-0">1</span>
            <span class="flex-1 text-sm text-[#2B1015]">Tech</span>
            <span class="text-[#B79E86]">&#8942;&#8942;</span>
          </div>
          <div class="rank-item flex items-center gap-3 bg-[#EDE0D2] border border-[#D9C9B6] rounded-lg px-4 py-3 cursor-grab" style="touch-action: none;" draggable="true" data-value="Finance">
            <span class="rank-num w-6 h-6 rounded-full bg-[#6B1D28] text-[#F3EAE0] text-xs flex items-center justify-center shrink-0">2</span>
            <span class="flex-1 text-sm text-[#2B1015]">Finance</span>
            <span class="text-[#B79E86]">&#8942;&#8942;</span>
          </div>
          <div class="rank-item flex items-center gap-3 bg-[#EDE0D2] border border-[#D9C9B6] rounded-lg px-4 py-3 cursor-grab" style="touch-action: none;" draggable="true" data-value="Media">
            <span class="rank-num w-6 h-6 rounded-full bg-[#6B1D28] text-[#F3EAE0] text-xs flex items-center justify-center shrink-0">3</span>
            <span class="flex-1 text-sm text-[#2B1015]">Media</span>
            <span class="text-[#B79E86]">&#8942;&#8942;</span>
          </div>
          <div class="rank-item flex items-center gap-3 bg-[#EDE0D2] border border-[#D9C9B6] rounded-lg px-4 py-3 cursor-grab" style="touch-action: none;" draggable="true" data-value="Construction">
            <span class="rank-num w-6 h-6 rounded-full bg-[#6B1D28] text-[#F3EAE0] text-xs flex items-center justify-center shrink-0">4</span>
            <span class="flex-1 text-sm text-[#2B1015]">Construction</span>
            <span class="text-[#B79E86]">&#8942;&#8942;</span>
          </div>
          <div class="rank-item flex items-center gap-3 bg-[#EDE0D2] border border-[#D9C9B6] rounded-lg px-4 py-3 cursor-grab" style="touch-action: none;" draggable="true" data-value="Others">
            <span class="rank-num w-6 h-6 rounded-full bg-[#6B1D28] text-[#F3EAE0] text-xs flex items-center justify-center shrink-0">5</span>
            <span class="flex-1 text-sm text-[#2B1015]">Others</span>
            <span class="text-[#B79E86]">&#8942;&#8942;</span>
          </div>
        </div>

        <label class="text-sm text-[#4A3B30] block mb-1">If "others", tell us what</label>
        <input type="text" name="othersDetail" placeholder="e.g. law, healthcare"
          class="w-full bg-[#F3EAE0] border border-[#B79E86] rounded-md px-3 py-2 text-sm mb-6">

        <button type="submit" class="w-full bg-[#6B1D28] text-[#F3EAE0] py-3 rounded-md text-sm font-medium">Submit request</button>

      </form>

    </div>

  </div>

  <script>
    // --- Drag-to-reorder logic (identical pattern to health.html) ---
    const rankList = document.getElementById('rankList');
    let draggedItem = null;

    rankList.querySelectorAll('.rank-item').forEach(item => {
      item.addEventListener('dragstart', () => {
        draggedItem = item;
        item.classList.add('dragging');
      });
      item.addEventListener('dragend', () => {
        item.classList.remove('dragging');
        draggedItem = null;
        updateRankNumbers();
      });
    });

    rankList.addEventListener('dragover', (e) => {
      e.preventDefault();
      const afterElement = getDragAfterElement(rankList, e.clientY);
      if (afterElement == null) {
        rankList.appendChild(draggedItem);
      } else {
        rankList.insertBefore(draggedItem, afterElement);
      }
    });

    function getDragAfterElement(container, y) {
      const items = [...container.querySelectorAll('.rank-item:not(.dragging)')];
      return items.reduce((closest, child) => {
        const box = child.getBoundingClientRect();
        const offset = y - box.top - box.height / 2;
        if (offset < 0 && offset > closest.offset) {
          return { offset: offset, element: child };
        } else {
          return closest;
        }
      }, { offset: -Infinity }).element;
    }

    function updateRankNumbers() {
      rankList.querySelectorAll('.rank-item').forEach((item, index) => {
        item.querySelector('.rank-num').textContent = index + 1;
      });
    }

    // --- Touch support for mobile ---
    rankList.querySelectorAll('.rank-item').forEach(item => {
      item.addEventListener('touchstart', () => {
        draggedItem = item;
        item.classList.add('dragging');
      }, { passive: true });

      item.addEventListener('touchmove', (e) => {
        if (!draggedItem) return;
        e.preventDefault();

        const touch = e.touches[0];
        const afterElement = getDragAfterElement(rankList, touch.clientY);
        if (afterElement == null) {
          rankList.appendChild(draggedItem);
        } else {
          rankList.insertBefore(draggedItem, afterElement);
        }
      }, { passive: false });

      item.addEventListener('touchend', () => {
        if (draggedItem) {
          draggedItem.classList.remove('dragging');
          draggedItem = null;
          updateRankNumbers();
        }
      });
    });

    // --- Form submission ---
    document.getElementById('careerForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const ranking = [...rankList.querySelectorAll('.rank-item')].map(item => item.dataset.value);

      const formData = {
        fullName: document.querySelector('[name="fullName"]').value,
        email: document.querySelector('[name="email"]').value,
        aspiration: document.querySelector('[name="aspiration"]').value,
        ranking: ranking,
        othersDetail: document.querySelector('[name="othersDetail"]').value
      };

      try {
        const response = await fetch('https://sparkling-reflection-production-4146.up.railway.app/submit-career', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(formData)
        });

        if (response.ok) {
          window.location.href = 'submitted.html';
        } else {
          alert('Something went wrong submitting your request. Please try again.');
        }
      } catch (err) {
        console.error(err);
        alert('Could not reach the server. Make sure the backend is running.');
      }
    });
  </script>

  <div id="siteFooter"></div>
  <script src="site-footer.js"></script>
</body>
</html>
