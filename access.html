<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access - Fair Future</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Shrikhand&display=swap" rel="stylesheet">

  <style>
    .font-logo {
      font-family: 'Shrikhand', cursive;
    }
  </style>
</head>
<body class="bg-[#F3EAE0]">

  <div class="p-4">

    <!-- NAV BAR -->
    <nav class="flex flex-col md:grid md:grid-cols-3 items-center gap-3 md:gap-0 bg-[#EDE0D2] border border-[#D9C9B6] rounded-2xl px-4 sm:px-6 py-3 sm:py-4">
      <a href="index.html" class="flex items-center gap-0.5 hover:opacity-70 transition md:justify-self-start"><img src="images/logo.png" alt="Fair Future logo" class="h-14 w-14 sm:h-24 sm:w-24 object-contain sm:-my-[34px]"><span class="font-logo text-xl sm:text-2xl text-[#3A0E14]">Fair Future</span></a>
      <div class="flex flex-wrap justify-center gap-4 sm:gap-6 text-sm text-[#4A3B30] md:justify-self-center">
        <a href="applicants.html" class="text-[#6B1D28] font-medium">For applicants</a>
        <a href="volunteers.html">For volunteers</a>
        <a href="schools.html">For schools</a>
      </div>
      
    </nav>

    <!-- BACK BUTTON: returns to whatever page the user came from -->
    <button onclick="history.back()" class="flex items-center gap-1 text-sm text-[#6B1D28] mt-4 ml-1 hover:opacity-70 transition">
      &#8592; Back
    </button>

    <!-- FORM -->
    <div class="max-w-md mx-auto mt-10 mb-16 bg-[#F3EAE0] border border-[#D9C9B6] rounded-2xl p-6">

      <p class="text-xs uppercase tracking-wide text-[#8A6A55] mb-1">Access</p>
      <h1 class="text-lg font-medium text-[#2B1015] mb-1">Request funding</h1>
      <p class="text-sm text-[#5C4A3D] mb-5">Tell us what you need and why, and we'll be in touch.</p>

      <form id="accessForm">

        <label class="text-sm text-[#4A3B30] block mb-1">Full name</label>
        <input type="text" name="fullName" required placeholder="Jane Doe"
          class="w-full bg-[#F3EAE0] border border-[#B79E86] rounded-md px-3 py-2 text-sm mb-4">

        <label class="text-sm text-[#4A3B30] block mb-1">Email</label>
        <input type="email" name="email" id="email" required placeholder="name@email.com"
          class="w-full bg-[#F3EAE0] border border-[#B79E86] rounded-md px-3 py-2 text-sm mb-4">

        <label class="text-sm text-[#4A3B30] block mb-1">Confirm email</label>
        <input type="email" name="confirmEmail" id="confirmEmail" required placeholder="name@email.com"
          class="w-full bg-[#F3EAE0] border border-[#B79E86] rounded-md px-3 py-2 text-sm mb-1">
        <p id="emailError" class="text-xs text-[#6B1D28] mb-4 hidden">Emails don't match — please check and try again.</p>

        <label class="text-sm text-[#4A3B30] block mb-1">School</label>
        <input type="text" name="school" required placeholder="e.g. Riverside Sixth Form"
          class="w-full bg-[#F3EAE0] border border-[#B79E86] rounded-md px-3 py-2 text-sm mb-4">

        <label class="text-sm text-[#4A3B30] block mb-1">What is the funding for?</label>
        <textarea name="fundingReason" required rows="3" placeholder="e.g. travel to attend a university open day"
          class="w-full bg-[#F3EAE0] border border-[#B79E86] rounded-md px-3 py-2 text-sm mb-4 resize-none"></textarea>

        <label class="text-sm text-[#4A3B30] block mb-1">Amount needed</label>
        <div class="relative mb-6">
          <span class="absolute left-3 top-1/2 -translate-y-1/2 text-sm text-[#5C4A3D]">£</span>
          <input type="number" name="amount" required min="0" step="0.01" placeholder="0.00"
            class="w-full bg-[#F3EAE0] border border-[#B79E86] rounded-md pl-7 pr-3 py-2 text-sm">
        </div>

        <button type="submit" class="w-full bg-[#6B1D28] text-[#F3EAE0] py-3 rounded-md text-sm font-medium">Submit request</button>

      </form>

    </div>

  </div>

  <script>
    document.getElementById('accessForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const confirmEmail = document.getElementById('confirmEmail').value;
      const emailError = document.getElementById('emailError');

      // Check the two email fields match before allowing submission
      if (email !== confirmEmail) {
        emailError.classList.remove('hidden');
        return; // stop here - don't submit
      } else {
        emailError.classList.add('hidden');
      }

      const formData = {
        fullName: document.querySelector('[name="fullName"]').value,
        email: email,
        school: document.querySelector('[name="school"]').value,
        fundingReason: document.querySelector('[name="fundingReason"]').value,
        amount: document.querySelector('[name="amount"]').value
      };

      try {
        const response = await fetch('https://sparkling-reflection-production-4146.up.railway.app/submit-access', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(formData)
        });

        if (response.ok) {
          window.location.href = 'submitted.html';
        } else {
          alert('Something went wrong submitting your request. Please try again.');
        }
      } catch (err) {
        console.error(err);
        alert('Could not reach the server. Make sure the backend is running.');
      }
    });
  </script>

  <div id="siteFooter"></div>
  <script src="site-footer.js"></script>
</body>
</html>
